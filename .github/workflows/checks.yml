name: Three-city data checks
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # package requires >=3.11; CI pins one supported minor
      - run: pip install numpy scipy pandas "shapely>=2" pyproj rasterio "affine<3" pyarrow pyogrio geopandas matplotlib numba psutil unidecode country_converter requests
      - run: python 03_run/run_city_demo.py run
      - run: python 03_run/run_city_demo.py check
